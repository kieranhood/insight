<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Insight{% endblock %} · Insight</title>
  <link rel="stylesheet" href="/static/css/insight.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/insight.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %} hx-headers='{"X-CSRF-Token": "{{ csrf_token or "" }}"}'>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Insight home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16 6v20M9 13l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-name">Insight</span><span class="brand-vendor">by 50N Systems</span>
    </a>
    {% if user %}
    <nav class="mainnav" aria-label="Main">
      <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Status</a>
      {% if user.is_engineer %}
      <a href="/engineer" {% if path.startswith("/engineer") %}aria-current="page"{% endif %}>Engineer</a>
      {% endif %}
    </nav>
    <form class="signout" method="post" action="/signout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <span class="who">{{ user.username }}</span>
      <button type="submit" class="btn btn-quiet">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main id="main" class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>{{ branding.COPYRIGHT }}</span>
    <a href="/about">Licence</a>
    <span>v{{ version }}</span>
  </footer>
</body>
</html>
