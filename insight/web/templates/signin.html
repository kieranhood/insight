{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Sign in</h1>
  {% if error %}<p class="alert alert-critical" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/signin" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label>Username <input name="username" autocomplete="username" required autofocus value="{{ username or '' }}"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</section>
<p class="licence-notice">{{ branding.LICENCE_NOTICE }}</p>
{% endblock %}
