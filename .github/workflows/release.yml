name: Release

# Push a tag like v0.1.0 to publish the image to the registry and attach an offline
# tarball (docker save) to a GitHub release, for yachts without internet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

      - name: Offline tarball
        run: |
          docker pull "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"
          docker save "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}" \
            -o "insight-${{ steps.version.outputs.version }}.tar"
          sha256sum "insight-${{ steps.version.outputs.version }}.tar" > "insight-${{ steps.version.outputs.version }}.tar.sha256"

      - name: GitHub release with the tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "insight-${{ steps.version.outputs.version }}.tar" \
            "insight-${{ steps.version.outputs.version }}.tar.sha256" \
            --title "Insight ${{ steps.version.outputs.version }}" \
            --notes "Image: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}. Offline install: docker load -i insight-${{ steps.version.outputs.version }}.tar"
