[project]
name = "insight"
version = "0.1.0"
description = "Insight by 50N Systems: on-board monitoring and diagnostics for yacht IT systems"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "50N Systems" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pysnmp>=7.1",
    "aioruckus>=0.42",
    "grpcio>=1.66",
    "grpcio-reflection>=1.66",
    "dnspython>=2.7",
    "icmplib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "playwright>=1.48",
]

[project.scripts]
insight = "insight.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insight"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"insight/web/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["insight"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
